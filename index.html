<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recicla Crush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12261f;
    --card-face: #f4efdf;
    --ink: #0d1f18;
    --lime: #a3d977;
    --amber: #e8b23d;
    --clay: #d97a4b;
    --muted: #9db8ab;
    --line: rgba(163, 217, 119, 0.18);

    --c-papel: #c8a15b;
    --c-vidro: #4f9d84;
    --c-lata: #8fa6b8;
    --c-plastico: #e8b23d;
    --c-pilha: #d9694b;
    --c-tecido: #b98fd1;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 15% -10%, rgba(163,217,119,0.10), transparent 55%),
      radial-gradient(ellipse at 100% 110%, rgba(232,178,61,0.08), transparent 50%),
      var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 50px;
    user-select: none;
  }

  .wrap { width: 100%; max-width: 460px; }

  header { text-align: center; margin-bottom: 18px; }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--lime);
    font-weight: 600;
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(30px, 8vw, 46px);
    color: var(--card-face);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  h1 em { font-style: normal; color: var(--lime); }

  .sub {
    color: var(--muted);
    font-size: 13.5px;
    max-width: 380px;
    margin: 0 auto;
    line-height: 1.5;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 26px;
    margin: 18px 0 16px;
  }

  .stat { text-align: center; }
  .stat-label {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 10.5px;
    color: var(--muted);
  }
  .stat b {
    display: block;
    font-size: 22px;
    color: var(--card-face);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat b.warn { color: var(--clay); }
  .stat b.best { color: var(--amber); }

  .board-frame {
    position: relative;
    background: linear-gradient(160deg, #1a3327, #0f231c);
    border-radius: 18px;
    padding: 10px;
    border: 1px solid var(--line);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2), 0 14px 40px rgba(0,0,0,0.35);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    aspect-ratio: 1 / 1;
    width: 100%;
    position: relative;
  }

  .board.locked { pointer-events: none; opacity: 0.92; }

  .tile {
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(16px, 4.4vw, 24px);
    cursor: pointer;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18), inset 0 2px 0 rgba(255,255,255,0.18);
    animation: tilePop 0.22s ease;
    transition: filter 0.15s ease;
  }

  .tile:hover { filter: brightness(1.08); }

  .tile.selected {
    box-shadow: 0 0 0 3px var(--card-face), inset 0 -3px 0 rgba(0,0,0,0.18);
    transform: scale(1.05);
  }

  .tile.matched {
    animation: matchPop 0.3s ease forwards;
    z-index: 2;
  }

  .tile.shake { animation: shake 0.35s ease; }

  .t-papel    { background: var(--c-papel); }
  .t-vidro    { background: var(--c-vidro); }
  .t-lata     { background: var(--c-lata); }
  .t-plastico { background: var(--c-plastico); }
  .t-pilha    { background: var(--c-pilha); }
  .t-tecido   { background: var(--c-tecido); }

  @keyframes tilePop {
    0% { transform: scale(0.4); opacity: 0; }
    70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes matchPop {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.8; }
    100% { transform: scale(0.15); opacity: 0; }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px) rotate(-4deg); }
    40% { transform: translateX(5px) rotate(4deg); }
    60% { transform: translateX(-4px) rotate(-3deg); }
    80% { transform: translateX(4px) rotate(3deg); }
  }

  .board-message {
    position: absolute;
    inset: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(15, 35, 28, 0.88);
    border-radius: 12px;
    color: var(--card-face);
    font-weight: 600;
    font-size: 14px;
    padding: 20px;
    z-index: 5;
  }
  .board-message.show { display: flex; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    justify-content: center;
    margin-top: 18px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .legend-swatch {
    width: 14px; height: 14px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  footer { margin-top: 22px; text-align: center; }

  .restart-link {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .restart-link:hover { color: var(--lime); }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(11,26,21,0.82);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--card-face);
    border-radius: 18px;
    padding: 36px 32px;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .modal .icon-big { font-size: 46px; margin-bottom: 6px; }
  .modal h2 {
    font-family: 'Fraunces', serif;
    font-size: 27px;
    margin: 4px 0 10px;
    color: var(--ink);
  }
  .modal p { color: #4a5f54; font-size: 14px; margin-bottom: 22px; line-height: 1.5; }

  .btn {
    background: var(--ink);
    color: var(--card-face);
    border: none;
    padding: 13px 26px;
    border-radius: 999px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .btn:hover { background: #1c3a2d; transform: translateY(-1px); }

  @media (prefers-reduced-motion: reduce) {
    .tile, .tile.matched, .tile.shake { animation: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Combine. Pontue. Recicle.</div>
    <h1>Recicla <em>Crush</em></h1>
    <p class="sub">Toque em duas peças vizinhas para trocar de lugar e formar fileiras de 3 ou mais materiais iguais.</p>
  </header>

  <div class="stats">
    <div class="stat">
      <span class="stat-label">Pontos</span>
      <b id="score">0</b>
    </div>
    <div class="stat">
      <span class="stat-label">Tempo</span>
      <b id="timer">01:30</b>
    </div>
    <div class="stat">
      <span class="stat-label">Recorde</span>
      <b class="best" id="best">0</b>
    </div>
  </div>

  <div class="board-frame">
    <div class="board" id="board"></div>
    <div class="board-message" id="boardMessage"></div>
  </div>

  <div class="legend" id="legend"></div>

  <footer>
    <button class="restart-link" id="restartBtn">Recomeçar jogo</button>
  </footer>
</div>

<div class="modal-overlay" id="endModal">
  <div class="modal">
    <div class="icon-big">♻️</div>
    <h2>Tempo esgotado!</h2>
    <p id="endText">Você pontuou.</p>
    <button class="btn" id="playAgainBtn">Jogar novamente</button>
  </div>
</div>

<script>
  const ROWS = 8, COLS = 8;
  const TYPES = [
    { key: 'papel',    icon: '📦', name: 'Papelão' },
    { key: 'vidro',    icon: '🍾', name: 'Vidro' },
    { key: 'lata',     icon: '🥫', name: 'Lata' },
    { key: 'plastico', icon: '🧴', name: 'Plástico' },
    { key: 'pilha',    icon: '🔋', name: 'Pilha' },
    { key: 'tecido',   icon: '👕', name: 'Tecido' },
  ];
  const TIME_LIMIT = 90;

  const boardEl = document.getElementById('board');
  const boardMessage = document.getElementById('boardMessage');
  const legendEl = document.getElementById('legend');
  const scoreEl = document.getElementById('score');
  const timerEl = document.getElementById('timer');
  const bestEl = document.getElementById('best');
  const endModal = document.getElementById('endModal');
  const endText = document.getElementById('endText');
  const restartBtn = document.getElementById('restartBtn');
  const playAgainBtn = document.getElementById('playAgainBtn');

  let grid = [];
  let selected = null;
  let locked = false;
  let score = 0;
  let best = 0;
  let timeLeft = TIME_LIMIT;
  let timerInterval = null;
  let started = false;
  let gameOver = false;

  function randType() { return Math.floor(Math.random() * TYPES.length); }

  function makeGrid() {
    const g = [];
    for (let r = 0; r < ROWS; r++) {
      g[r] = [];
      for (let c = 0; c < COLS; c++) {
        let t;
        do {
          t = randType();
        } while (
          (c >= 2 && g[r][c - 1] === t && g[r][c - 2] === t) ||
          (r >= 2 && g[r - 1][c] === t && g[r - 2][c] === t)
        );
        g[r][c] = t;
      }
    }
    return g;
  }

  function findMatches(g) {
    const matched = new Set();
    for (let r = 0; r < ROWS; r++) {
      let runStart = 0;
      for (let c = 1; c <= COLS; c++) {
        if (c < COLS && g[r][c] !== null && g[r][c] === g[r][runStart]) continue;
        if (c - runStart >= 3) {
          for (let k = runStart; k < c; k++) matched.add(r + ',' + k);
        }
        runStart = c;
      }
    }
    for (let c = 0; c < COLS; c++) {
      let runStart = 0;
      for (let r = 1; r <= ROWS; r++) {
        if (r < ROWS && g[r][c] !== null && g[r][c] === g[runStart][c]) continue;
        if (r - runStart >= 3) {
          for (let k = runStart; k < r; k++) matched.add(k + ',' + c);
        }
        runStart = r;
      }
    }
    return matched;
  }

  function collapseAndFill(g, matchedSet) {
    matchedSet.forEach((key) => {
      const [r, c] = key.split(',').map(Number);
      g[r][c] = null;
    });
    const newCells = new Set();
    for (let c = 0; c < COLS; c++) {
      const col = [];
      for (let r = 0; r < ROWS; r++) if (g[r][c] !== null) col.push(g[r][c]);
      const missing = ROWS - col.length;
      const fresh = [];
      for (let i = 0; i < missing; i++) fresh.push(randType());
      const full = fresh.concat(col);
      for (let r = 0; r < ROWS; r++) {
        g[r][c] = full[r];
        if (r < missing) newCells.add(r + ',' + c);
      }
    }
    return newCells;
  }

  function hasValidMoves(g) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (c + 1 < COLS) {
          swap(g, r, c, r, c + 1);
          const m = findMatches(g);
          swap(g, r, c, r, c + 1);
          if (m.size > 0) return true;
        }
        if (r + 1 < ROWS) {
          swap(g, r, c, r + 1, c);
          const m = findMatches(g);
          swap(g, r, c, r + 1, c);
          if (m.size > 0) return true;
        }
      }
    }
    return false;
  }

  function swap(g, r1, c1, r2, c2) {
    const tmp = g[r1][c1];
    g[r1][c1] = g[r2][c2];
    g[r2][c2] = tmp;
  }

  function isAdjacent(a, b) {
    return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
  }

  function render(opts) {
    opts = opts || {};
    const matched = opts.matched || new Set();
    const shake = opts.shake || new Set();
    const newly = opts.newly || new Set();
    boardEl.innerHTML = '';

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const key = r + ',' + c;
        const type = TYPES[grid[r][c]];
        const tile = document.createElement('div');
        tile.className = 'tile t-' + type.key;
        tile.textContent = type.icon;
        tile.setAttribute('role', 'button');
        tile.setAttribute('aria-label', type.name);
        tile.dataset.r = r;
        tile.dataset.c = c;

        if (selected && selected.r === r && selected.c === c) tile.classList.add('selected');
        if (matched.has(key)) tile.classList.add('matched');
        if (shake.has(key)) tile.classList.add('shake');
        if (newly.has(key) && !matched.has(key)) {
          tile.style.animation = 'tilePop 0.28s ease';
        }

        tile.addEventListener('click', () => handleTileClick(r, c));
        boardEl.appendChild(tile);
      }
    }
  }

  function showMessage(text) {
    boardMessage.textContent = text;
    boardMessage.classList.add('show');
  }
  function hideMessage() {
    boardMessage.classList.remove('show');
  }

  function handleTileClick(r, c) {
    if (locked || gameOver) return;
    startTimer();

    if (!selected) {
      selected = { r, c };
      render();
      return;
    }

    if (selected.r === r && selected.c === c) {
      selected = null;
      render();
      return;
    }

    if (!isAdjacent(selected, { r, c })) {
      selected = { r, c };
      render();
      return;
    }

    const a = selected, b = { r, c };
    selected = null;
    locked = true;
    swap(grid, a.r, a.c, b.r, b.c);
    const matches = findMatches(grid);

    if (matches.size > 0) {
      render();
      resolveStep(1);
    } else {
      const shakeSet = new Set([a.r + ',' + a.c, b.r + ',' + b.c]);
      render({ shake: shakeSet });
      setTimeout(() => {
        swap(grid, a.r, a.c, b.r, b.c);
        render();
        locked = false;
      }, 350);
    }
  }

  function resolveStep(combo) {
    const matched = findMatches(grid);
    if (matched.size === 0) {
      if (!hasValidMoves(grid)) {
        showMessage('Sem jogadas possíveis — embaralhando...');
        setTimeout(() => {
          grid = makeGrid();
          render();
          hideMessage();
          locked = false;
        }, 700);
      } else {
        locked = false;
      }
      return;
    }

    score += matched.size * 10 * combo;
    scoreEl.textContent = score;
    render({ matched });

    setTimeout(() => {
      const newCells = collapseAndFill(grid, matched);
      render({ newly: newCells });
      setTimeout(() => resolveStep(combo + 1), 280);
    }, 300);
  }

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function startTimer() {
    if (started) return;
    started = true;
    timerInterval = setInterval(() => {
      timeLeft--;
      timerEl.textContent = formatTime(timeLeft);
      if (timeLeft <= 10) timerEl.classList.add('warn');
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    started = false;
  }

  function endGame() {
    stopTimer();
    gameOver = true;
    locked = true;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
    }
    endText.textContent = `Você reciclou ${score} pontos em ${TIME_LIMIT} segundos.`;
    endModal.classList.add('show');
  }

  function buildLegend() {
    legendEl.innerHTML = '';
    TYPES.forEach((t) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-swatch t-${t.key}"></span>${t.icon} ${t.name}`;
      legendEl.appendChild(item);
    });
  }

  function resetGame() {
    stopTimer();
    grid = makeGrid();
    selected = null;
    locked = false;
    gameOver = false;
    score = 0;
    timeLeft = TIME_LIMIT;
    started = false;
    scoreEl.textContent = '0';
    timerEl.textContent = formatTime(TIME_LIMIT);
    timerEl.classList.remove('warn');
    endModal.classList.remove('show');
    hideMessage();
    render();
  }

  restartBtn.addEventListener('click', resetGame);
  playAgainBtn.addEventListener('click', resetGame);

  buildLegend();
  resetGame();
</script>

</body>
</html>
